<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta Préstamo - Obra Baño</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl border-b-4 border-blue-500 text-center">
            <h1 class="text-xs font-bold uppercase tracking-widest text-blue-400 mb-2">Estado Actual del Préstamo</h1>
            <p class="text-3xl font-black" id="restante">$ 6.000.000</p>
            <div class="flex justify-center gap-4 mt-2">
                <span id="porcentaje" class="text-blue-400 font-bold text-sm">0% pagado</span>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Historial de devoluciones</h2>
            <div id="historial" class="space-y-4 text-center">
                <p class="text-slate-300 animate-pulse py-4 italic">Sincronizando con Google Sheets...</p>
            </div>
        </div>

        <p class="text-center text-[10px] text-slate-400 uppercase tracking-widest">Actualizado en tiempo real • Google Sheets</p>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzmtzsVIv8q3rniOuhomgPlxfFIgZP-CqC9MrD8Rjx7zppBG9ulgLoUY99JOm54tAhA0w/exec";
        const DEUDA_TOTAL = 6000000;

        async function refresh() {
            try {
                const response = await fetch(WEB_APP_URL);
                const data = await response.json();
                const dataOrdenada = [...data].reverse();

                const pagado = data.reduce((s, i) => s + Number(i.importe), 0);
                const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });

                document.getElementById('restante').innerText = fmt.format(DEUDA_TOTAL - pagado);
                document.getElementById('porcentaje').innerText = ((pagado/DEUDA_TOTAL)*100).toFixed(1) + "% pagado";

                document.getElementById('historial').innerHTML = dataOrdenada.map(p => {
                    const fechaFormateada = new Date(p.fecha).toLocaleDateString('es-AR', {timeZone: 'UTC'});
                    return `
                        <div class="flex justify-between items-center border-b border-slate-50 pb-3 text-left">
                            <div>
                                <p class="text-[10px] font-bold text-slate-400">${fechaFormateada}</p>
                                <p class="font-bold text-slate-700 text-lg">${fmt.format(p.importe)}</p>
                            </div>
                        </div>
                    `;
                }).join('') || '<p class="text-center text-slate-300 italic py-4">No se registran pagos todavía</p>';
            } catch (e) {
                document.getElementById('historial').innerHTML = '<p class="text-red-400 py-4 italic">Error al conectar con el servidor</p>';
            }
        }

        window.onload = refresh;
    </script>
</body>
</html>
