<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Préstamo - Matías</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-4">
    <div class="max-w-md mx-auto space-y-4">
        
        <div class="bg-slate-900 rounded-3xl p-6 text-white shadow-2xl border-b-4 border-emerald-500">
            <h1 class="text-xs font-bold uppercase tracking-widest text-emerald-400 mb-2">Estado de la Obra</h1>
            <div class="flex justify-between items-end">
                <div>
                    <p class="text-3xl font-black" id="restante">$ 6.000.000</p>
                    <p class="text-[10px] text-slate-400 uppercase mt-1">Saldo Pendiente</p>
                </div>
                <div class="text-right">
                    <p class="text-xl font-bold text-emerald-400" id="porcentaje">0%</p>
                    <p class="text-[10px] text-slate-400 uppercase">Pagado</p>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <form id="formPago" class="space-y-3">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1">Monto a registrar</label>
                <input type="number" id="importe" placeholder="Ej: 50000" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none font-bold text-lg">
                <label class="text-xs font-bold text-slate-500 uppercase ml-1 block mt-2">Fecha</label>
                <input type="date" id="fecha" required class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl">
                <button type="submit" id="btn" class="w-full bg-emerald-500 text-white font-black py-4 rounded-xl hover:bg-emerald-600 transition-all uppercase tracking-widest shadow-lg mt-4">
                    Registrar Pago
                </button>
            </form>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-xs font-bold text-slate-400 uppercase mb-4 tracking-widest">Movimientos Realizados</h2>
            <div id="historial" class="space-y-4">
                <p class="text-center text-slate-300 animate-pulse">Cargando datos...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://mkkxxncphufevgpiopdx.supabase.co";
        const SUPABASE_KEY = "sb_publishable_4EzeJFLZV7LjpNZGmJzZoQ_x309PXxk";
        const DEUDA_TOTAL = 6000000;

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function refresh() {
            const { data, error } = await _supabase.from('pagos').select('*').order('id', { ascending: false });
            if (error) return;

            const pagado = data.reduce((s, i) => s + Number(i.importe), 0);
            const fmt = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' });

            document.getElementById('restante').innerText = fmt.format(DEUDA_TOTAL - pagado);
            document.getElementById('porcentaje').innerText = ((pagado/DEUDA_TOTAL)*100).toFixed(1) + "%";

            document.getElementById('historial').innerHTML = data.map(p => `
                <div class="flex justify-between items-center border-b border-slate-50 pb-3">
                    <div>
                        <p class="text-[10px] font-bold text-slate-400">${new Date(p.fecha).toLocaleDateString('es-AR', {timeZone: 'UTC'})}</p>
                        <p class="font-bold text-slate-700 text-lg">${fmt.format(p.importe)}</p>
                    </div>
                    <div class="h-8 w-8 bg-emerald-50 rounded-full flex items-center justify-center">
                        <span class="text-emerald-500 text-xs font-bold">✓</span>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 italic py-4">Sin movimientos aún</p>';
        }

        document.getElementById('formPago').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "GUARDANDO...";

            const { error } = await _supabase.from('pagos').insert([{ 
                importe: document.getElementById('importe').value, 
                fecha: document.getElementById('fecha').value 
            }]);

            if (!error) {
                document.getElementById('formPago').reset();
                document.getElementById('fecha').valueAsDate = new Date();
                await refresh();
                alert("¡Pago registrado con éxito!");
            } else {
                alert("Error al guardar: Verificá los permisos (Policies) en Supabase");
            }
            btn.disabled = false;
            btn.innerText = "REGISTRAR PAGO";
        }

        window.onload = () => {
            document.getElementById('fecha').valueAsDate = new Date();
            refresh();
        }
    </script>
</body>
</html>
